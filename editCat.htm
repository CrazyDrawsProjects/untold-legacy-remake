<!DOCTYPE html>

<html class="cat_bkg">
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-135452145-1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'UA-135452145-1');
    </script>

    <title>Add New Cat | Untold Legacy | A Paw in Each World</title>
    <link rel="icon" href="https://ulprivate.neocities.org/favicon.ico" type="image/x-icon">
    <script src="edit_cat.js"></script>
    <script src="jquery-3.3.1.min.js"></script>
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css?family=Almendra SC" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=EB Garamond" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Balthazar" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap.min.css" integrity="" crossorigin="anonymous">
    <script src="popper.min.js" integrity="" crossorigin="anonymous"></script>
    <script src="bootstrap.min.js" integrity="" crossorigin="anonymous"></script>
    <script src="seedrandom.min.js"></script>
    <link rel="stylesheet" href="all.css" integrity="" crossorigin="anonymous">
    
  </head>
  <body onload="initJSON()">
    <div id="cat_photo" style="float:left; position:absolute; top:15px; left:15px; width:160px; height:160px;">
      <img id="cat_photo_img" src="" style="width: inherit !important; height: inherit !important;">
      <select id="cat_photo_input" style="width:100%; position:absolute; top:160px;" onchange="updateCatToEdit()">
      </select>
    </div>
    <div style="position:absolute; top:180px; left:180px; color:red;" id="file_error_message"></div>
    <div class="form-row" id="photoForm" style="position:absolute; top:210px; left:20px;">
      <input data-toggle="tooltip" data-placement="bottom" onchange="uploadPhotoToServer()" title="Image resolution must be 500x500 px. Supported filetypes: jpeg, jpg, png" type="file" name="fileToUpload" class="form-control-file" id="fileToUpload" style="width:200px;">
    </div>
    <div id="cat_details_paragraph">
      <h1 class="allegiences_title" id="cat_details_name"><span id="cat_name_title"></span></h1>
      <div id="details_paragraph">
        <h3 class="clan_title">Cat Details</h3>
        <br>
        <ul>
          <li class="rank_title"></li>
          <ul id="cat_details_name_list">
            <li class="allegience_row"><input type="text" onchange="updateCatToEdit()" id="cat_name_input" maxlength="100"></input></li>
          </ul>
        </ul>
        <br>
        <br>
        <br>
        <br>
        <ul>
          <li class="rank_title">Description</li>
          <ul id="cat_details_description_list">
            <li class="allegience_row">
              <div class="form-row">
                <input type="text" onchange="updateCatToEdit()" id="cat_description_input" size="15" maxlength="100"></input>
                <select id="cat_gender_input" onchange="updateCatToEdit()">
                  <option value="she-cat">she-cat</option>
                  <option value="tom">tom</option>
                </select>
                <input type="text" onchange="updateCatToEdit()" id="cat_additional_descriptor_input" size="10" maxlength="100"></input>
              </div>
            </li>
          </ul>
        </ul>
        <br>
        <ul>
          <li class="rank_title">Name Color</li>
          <ul id="nameplate_list">
            <li class="allegience_row">
              <select id="cat_name_color_input" onchange="updateCatToEdit()">
                <option value="light orange">light orange</option>
                <option value="orange">orange</option>
                <option value="dark orange">dark orange</option>
                <option value="white">white</option>
                <option value="gray">gray</option>
                <option value="dark gray">dark gray</option>
                <option value="golden brown">golden brown</option>
                <option value="golden">golden</option>
                <option value="light brown">light brown</option>
                <option value="brown">brown</option>
                <option value="dark brown">dark brown</option>
                <option value="cream">cream</option>
                <option value="dark cream">dark cream</option>
                <option value="black">black</option>
                <option value="reddish-brown">reddish-brown</option>
                <option value="red">red</option>
                <option value="blue">blue</option>
                <option value="pink">pink</option>
              </select>
            </li>
          </ul>
        </ul>
        <br>
        <ul>
          <li class="rank_title">Allegience</li>
          <ul id="cat_details_allegience_list">
            <li class="allegience_row">
              <select id="cat_allegience_input" onchange="updateCatToEdit()" style="font-family:'icomoon' !important;">
                <option value="ThunderClan" id="clan_one_allegience_option"></option>
                <option value="ShadowClan" id="clan_two_allegience_option"></option>
                <option value="WindClan" id="clan_three_allegience_option"></option>
                <option value="RiverClan" id="clan_four_allegience_option"></option>
                <option value="Loner" id="clan_five_allegience_option"></option>
              </select>
            </li>
          </ul>
        </ul>
        <br>
        <ul>
          <li class="rank_title">Rank</li>
          <ul id="cat_details_rank_list">
            <li class="allegience_row">
              <select id="cat_rank_input" onchange="updateCatToEdit()">
              </select>
            </li>
          </ul>
        </ul>
        <br>
        <ul>
          <li class="rank_title">Age</li>
          <ul id="cat_details_age_list">
            <li class="allegience_row"><input id="cat_moons_input" onchange="updateCatToEdit()" type="number" value="0" max="250" min="0" step="1"></input><i> moons</i></li>
          </ul>
        </ul>
        <br>
        <ul class="mates">
          <li class="rank_title">Mates</li>
          <ul id="cat_details_mates_list">
            <li class="allegience_row">
              <ul id="cat_mates" style="margin-left:-40px !important;">
              </ul>
              <select id="cat_mates_input" onchange="updateCatToEdit()" style="font-family:'icomoon' !important;">
              </select>
              <button id="cat_mates_submit" class="btn btn-primary" onclick="addSelectedMate()"><i class="fa fa-plus-circle"></i> Add Selected Mate</button>
            </li>
          </ul>
        </ul>
        <br>
        <ul>
          <li class="rank_title">Mother</li>
          <ul id="cat_details_mother_list">
            <li class="allegience_row">
              <div class="form-row">
                <select id="cat_mother_type_input" onchange="updateCatToEdit()">
                  <option value="living" id="cat_mother_type_living">living</option>
                  <option value="dead" id="cat_mother_type_dead">deceased</option>
                </select>
                <select id="cat_mother_input" onchange="updateCatToEdit()" style="font-family:'icomoon' !important;">
                </select>
              </div>
            </li>
          </ul>
        </ul>
        <br>
        <ul>
          <li class="rank_title">Father</li>
          <ul id="cat_details_father_list">
            <li class="allegience_row">
              <div class="form-row">
                <select id="cat_father_type_input" onchange="updateCatToEdit()">
                  <option value="living" id="cat_father_type_living">living</option>
                  <option value="dead" id="cat_father_type_dead">deceased</option>
                </select>
                <select id="cat_father_input" onchange="updateCatToEdit()" style="font-family:'icomoon' !important;">
                </select>
              </div>
            </li>
          </ul>
        </ul>
        <br>
        <ul class="apprentice">
          <li class="rank_title">Apprentice</li>
          <ul id="cat_details_apprentice_list">
            <li class="allegience_row">
              <select id="cat_apprentice_input" onchange="updateCatToEdit()" style="font-family:'icomoon' !important;">
              </select>
            </li>
          </ul>
        </ul>
        <br class="apprentice">
      </div>
      <div id="controls_center">
        <input type="button" value="Save Changes" class="btn btn-lg btn-success" onclick="editCatToJSON()"></input>
        <input type="button" value="Cancel" class="btn btn-lg btn-secondary" onclick="window.close()"></input>
      </div>
    </div>
  </body>
</html>
